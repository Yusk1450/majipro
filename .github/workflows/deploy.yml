name: Deploy to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Setup SSH known hosts
        run: ssh-keyscan -p "${SSH_PORT}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}

      - name: Deploy with rsync
        run: |
          rsync -avz --delete \
            --exclude 'templates_c/' \
            --exclude '.DS_Store' \
            -e "sshpass -e ssh -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" \
            src/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_REMOTE_PATH }}"
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
